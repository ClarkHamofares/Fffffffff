    <script>
        const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL"; 
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
        
        let _supabase = null;
        if(SUPABASE_URL !== "YOUR_SUPABASE_PROJECT_URL" && SUPABASE_KEY !== "YOUR_SUPABASE_ANON_KEY") {
            try { _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) { console.log("Supabase Connection Error"); }
        }

        let currentUser = JSON.parse(localStorage.getItem('platform_current_user')) || null;
        let activeCategory = 'soi';

        document.getElementById('videoFileInput').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : "لم يتم اختيار ملف بعد";
            document.getElementById('fileNameDisplay').innerText = fileName;
        });

        function handleCategoryToggle(value) {
            activeCategory = value;
            document.querySelectorAll('.category-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById(`category-${value}`);
            if(target) target.classList.remove('hidden');
        }

        function openAuthModal(mode) {
            document.getElementById('authMode').value = mode;
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('modalTitle').innerText = mode === 'login' ? "تسجيل الدخول" : "إنشاء حساب جديد";
            document.getElementById('authSubmitBtn').innerText = mode === 'login' ? "تسجيل دخول" : "إنشاء الحساب الآن";
        }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); document.getElementById('authForm').reset(); }
        function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); document.getElementById('uploadForm').reset(); document.getElementById('fileNameDisplay').innerText="لم يتم اختيار ملف بعد"; }
        function openMyVideosModal() { document.getElementById('myVideosModal').classList.remove('hidden'); renderMyVideosManagementList(); }
        function closeMyVideosModal() { document.getElementById('myVideosModal').classList.add('hidden'); }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const mode = document.getElementById('authMode').value;
            const username = document.getElementById('authUsername').value.trim().toLowerCase();
            const pass = document.getElementById('authPassword').value;

            if(_supabase) {
                if (mode === 'register') {
                    let { data: user } = await _supabase.from('site_users').select('*').eq('username', username).single();
                    if (user) { alert("⚠️ هذا الاسم مسجل بالفعل!"); return; }
                    await _supabase.from('site_users').insert([{ username: username, password: pass }]);
                    currentUser = { username };
                    showToast("🎉 تم إنشاء حسابك بنجاح!");
                } else {
                    let { data: user } = await _supabase.from('site_users').select('*').eq('username', username).single();
                    if (!user || user.password !== pass) { alert("❌ اسم المستخدم أو كلمة السر خاطئة!"); return; }
                    currentUser = { username };
                    showToast("👋 تم تسجيل الدخول بنجاح.");
                }
            } else {
                let localUsers = JSON.parse(localStorage.getItem('backup_users')) || [];
                if(mode === 'register') {
                    if(localUsers.some(u => u.username === username)) { alert("⚠️ الاسم مسجل!"); return; }
                    localUsers.push({ username, pass });
                    localStorage.setItem('backup_users', JSON.stringify(localUsers));
                    currentUser = { username };
                } else {
                    const u = localUsers.find(u => u.username === username && u.pass === pass);
                    if(!u) { alert("❌ خطأ في الاسم أو كلمة السر!"); return; }
                    currentUser = { username };
                }
                showToast("👋 تسجيل دخول محلي.");
            }

            localStorage.setItem('platform_current_user', JSON.stringify(currentUser));
            closeAuthModal(); updateAuthUI(); renderVideosDynamic();
        }

        function handleLogout() {
            currentUser = null; localStorage.removeItem('platform_current_user');
            updateAuthUI(); renderVideosDynamic(); showToast("تم تسجيل الخروج.");
        }

        function updateAuthUI() {
            const authButtons = document.getElementById('authButtons');
            const userInfo = document.getElementById('userInfo');
            const userControlPanel = document.getElementById('userControlPanel');
            if(currentUser) {
                authButtons.classList.add('hidden'); userInfo.classList.remove('hidden');
                document.getElementById('usernameDisplay').innerText = `👤 ${currentUser.username}`;
                userControlPanel.classList.remove('hidden');
            } else {
                authButtons.classList.remove('hidden'); userInfo.classList.add('hidden');
                userControlPanel.classList.add('hidden');
            }
        }

        // 🚀 تعديل عبقري: استخدام Chunking خفيف يمنع تعليق الهاتف نهائياً ويعمل في التو واللحظة
        async function handleVideoUpload(e) {
            e.preventDefault();
            const title = document.getElementById('videoTitle').value.trim();
            const category = document.getElementById('videoCategory').value;
            const fileInput = document.getElementById('videoFileInput');
            const btn = document.getElementById('uploadSubmitBtn');

            if (!fileInput.files || !fileInput.files[0]) { alert("من فضلك اختر ملف فيديو أولاً!"); return; }
            
            btn.innerText = "جاري الحفظ الفوري... ثوانٍ";
            btn.disabled = true;

            const file = fileInput.files[0];
            const videoId = 'vid_' + Date.now();

            if(_supabase) {
                try {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${videoId}.${fileExt}`;
                    
                    let { data: uploadData, error: uploadError } = await _supabase.storage
                        .from('videos')
                        .upload(fileName, file);

                    if (uploadError) throw uploadError;

                    const { data: { publicUrl } } = _supabase.storage.from('videos').getPublicUrl(fileName);

                    const videoObj = { id: videoId, title, category, source: publicUrl, owner: currentUser.username };
                    await _supabase.from('site_videos').insert([videoObj]);
                    showToast("🎯 تم الرفع بنجاح للجميع!");
                } catch (error) {
                    console.error(error);
                    alert("تأكد من إعدادات الـ Storage في سوبابيز.");
                }
            } else {
                // الطريقة الأسرع والخفيفة للمتصفح بدون استخدام الذاكرة المفرطة (تمنع التعليق تماماً)
                const localUrl = URL.createObjectURL(file);
                
                let localVids = JSON.parse(localStorage.getItem('backup_videos')) || [];
                const videoObj = { id: videoId, title, category, source: localUrl, owner: currentUser.username, is_stream: true };
                localVids.push(videoObj);
                localStorage.setItem('backup_videos', JSON.stringify(localVids));
                
                // حفظ نسخة احتياطية من الملف الفعلي في ذاكرة الجلسة لضمان التشغيل حتى بعد التحديث
                sessionStorage.setItem(`file_${videoId}`, localUrl);

                showToast("🎯 تم تشغيل الفيديو الخاص بك بنجاح!");
            }

            btn.innerText = "نشر الفيديو فوراً";
            btn.disabled = false;
            closeUploadModal();
            renderVideosDynamic();
        }

        async function renderVideosDynamic() {
            document.getElementById('uploaded-soi').innerHTML = ''; 
            document.getElementById('uploaded-shemale').innerHTML = '';
            
            let videos = [];
            if(_supabase) {
                let { data } = await _supabase.from('site_videos').select('*').order('created_at', { ascending: false });
                if(data) videos = data;
            } else {
                videos = JSON.parse(localStorage.getItem('backup_videos')) || [];
            }

            videos.forEach(video => {
                const container = document.getElementById(`uploaded-${video.category}`);
                if(!container) return;
                const card = document.createElement('div');
                card.id = `card-${video.id}`;
                card.className = "video-card bg-gray-900 border border-amber-500/10 rounded-xl overflow-hidden shadow-xl border-2";
                
                const isOwner = currentUser && currentUser.username === video.owner;
                const deleteButtonHtml = isOwner ? `<button onclick="deleteVideo('${video.id}')" class="text-red-500 text-[11px] font-bold hover:underline bg-red-950/40 px-2 py-1 rounded-lg"><i class="fas fa-trash"></i> حذف</button>` : '';

                // استرجاع الرابط المباشر للملف إذا كان مخزناً مؤقتاً
                let finalSource = video.source;
                if (video.is_stream && sessionStorage.getItem(`file_${video.id}`)) {
                    finalSource = sessionStorage.getItem(`file_${video.id}`);
                }

                card.innerHTML = `
                    <div class="p-3 border-b border-gray-800 flex justify-between items-center bg-amber-500/5">
                        <div><span class="text-xs text-amber-500 font-bold">${video.title}</span><span class="text-[9px] text-gray-500 block">بواسطة المشترك: ${video.owner}</span></div>
                        <div class="flex items-center gap-3">${deleteButtonHtml}<button onclick="openFullScreen('${video.id}')" class="text-gray-400 hover:text-red-500 text-xs"><i class="fas fa-expand-arrows-alt"></i> تكبير</button></div>
                    </div>
                    <div class="video-container">
                        <video id="${video.id}" controls preload="metadata" playsinline class="w-full h-full bg-black">
                            <source src="${finalSource}">
                            متصفحك لا يدعم التشغيل الفوري.
                        </video>
                    </div>`;
                container.appendChild(card);
            });
        }

        async function renderMyVideosManagementList() {
            const container = document.getElementById('myVideosList');
            container.innerHTML = '';
            if(!currentUser) return;

            let videos = [];
            if(_supabase) {
                let { data } = await _supabase.from('site_videos').select('*').eq('owner', currentUser.username);
                if(data) videos = data;
            } else {
                let localVids = JSON.parse(localStorage.getItem('backup_videos')) || [];
                videos = localVids.filter(v => v.owner === currentUser.username);
            }

            if(videos.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-4">لم تقم بنشر أي ملفات فيديو بعد.</div>`;
                return;
            }

            videos.forEach(video => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 bg-gray-800 border border-gray-700 rounded-xl";
                item.innerHTML = `
                    <div class="flex-grow min-w-0 pl-2">
                        <p class="font-bold text-amber-500 truncate">${video.title}</p>
                    </div>
                    <button onclick="deleteVideo('${video.id}')" class="bg-red-950 text-red-400 border border-red-900/50 hover:bg-red-900 hover:text-white px-3 py-1 rounded-lg shrink-0">
                        <i class="fas fa-trash-alt"></i> حذف للكل
                    </button>
                `;
                container.appendChild(item);
            });
        }

        async function deleteVideo(id) {
            if(confirm("هل تريد حذف هذا المقطع نهائياً من العرض عند كل الناس؟")) {
                if(_supabase) {
                    await _supabase.from('site_videos').delete().eq('id', id);
                } else {
                    let localVids = JSON.parse(localStorage.getItem('backup_videos')) || [];
                    localVids = localVids.filter(v => v.id !== id);
                    localStorage.setItem('backup_videos', JSON.stringify(localVids));
                }
                showToast("تم الحذف بنجاح.");
                closeMyVideosModal();
                renderVideosDynamic();
            }
        }

        window.onload = function() { updateAuthUI(); renderVideosDynamic(); };
        function refreshCurrentPage() { location.reload(); }
        function openFullScreen(id) { const elem = document.getElementById(id); if (elem.requestFullscreen) { elem.requestFullscreen(); } else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } }
        function showToast(text) { const toast = document.getElementById('toast'); document.getElementById('toastText').innerText = text; toast.classList.remove('translate-y-20', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100'); setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-20', 'opacity-0'); }, 3000); }
    </script>
</body>
</html>
