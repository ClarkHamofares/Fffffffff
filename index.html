    <script>
        let currentUser = JSON.parse(localStorage.getItem('platform_current_user')) || null;
        let activeCategory = 'soi';

        function handleCategoryToggle(value) {
            activeCategory = value;
            document.querySelectorAll('.category-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`category-${value}`).classList.remove('hidden');
        }

        function openAuthModal(mode) {
            document.getElementById('authMode').value = mode;
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('modalTitle').innerText = mode === 'login' ? "تسجيل الدخول" : "إنشاء حساب جديد";
            document.getElementById('authSubmitBtn').innerText = mode === 'login' ? "تسجيل دخول" : "إنشاء الحساب الآن";
        }

        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); document.getElementById('authForm').reset(); }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const mode = document.getElementById('authMode').value;
            const username = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value;
            let users = JSON.parse(localStorage.getItem('platform_users_list')) || [];

            if(mode === 'register') {
                if(users.some(u => u.username.toLowerCase() === username.toLowerCase())) { alert("⚠️ هذا الاسم مسجل بالفعل!"); return; }
                const newUser = { username, pass };
                users.push(newUser);
                localStorage.setItem('platform_users_list', JSON.stringify(users));
                currentUser = newUser;
                showToast("🎉 تم إنشاء الحساب بنجاح!");
            } else {
                const foundUser = users.find(u => u.username.toLowerCase() === username.toLowerCase());
                if (!foundUser) { alert("⚠️ اسم المستخدم غير موجود!"); return; }
                if (foundUser.pass !== pass) { alert("❌ كلمة السر غلط! يرجى إعادة المحاولة."); return; }
                currentUser = foundUser;
                showToast("👋 أهلاً بك! تم تسجيل الدخول.");
            }

            localStorage.setItem('platform_current_user', JSON.stringify(currentUser));
            closeAuthModal(); updateAuthUI(); renderAllUploadedVideos();
        }

        function handleLogout() {
            currentUser = null; localStorage.removeItem('platform_current_user');
            updateAuthUI(); renderAllUploadedVideos(); showToast("تم تسجيل الخروج.");
        }

        function updateAuthUI() {
            const authButtons = document.getElementById('authButtons');
            const userInfo = document.getElementById('userInfo');
            const userControlPanel = document.getElementById('userControlPanel');

            if(currentUser) {
                authButtons.classList.add('hidden'); userInfo.classList.remove('hidden');
                document.getElementById('usernameDisplay').innerText = `👤 ${currentUser.username}`;
                userControlPanel.classList.remove('hidden');
            } else {
                authButtons.classList.remove('hidden'); userInfo.classList.add('hidden');
                userControlPanel.classList.add('hidden');
            }
        }

        function openMyVideosModal() {
            document.getElementById('myVideosModal').classList.remove('hidden');
            renderMyVideosManagementList();
        }

        function closeMyVideosModal() {
            document.getElementById('myVideosModal').classList.add('hidden');
        }

        function renderMyVideosManagementList() {
            const container = document.getElementById('myVideosList');
            container.innerHTML = '';
            let localVideos = JSON.parse(localStorage.getItem('platform_secured_videos')) || [];
            let myVideos = localVideos.filter(v => currentUser && v.owner === currentUser.username);

            if(myVideos.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-4">لم تقم برفع أي فيديوهات بعد.</div>`;
                return;
            }

            myVideos.forEach(video => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 bg-gray-800 border border-gray-700 rounded-xl";
                item.innerHTML = `
                    <div class="flex-grow min-w-0 pl-2">
                        <p class="font-bold text-amber-500 truncate">${video.title}</p>
                        <span class="text-[10px] text-gray-400">القسم: ${video.category === 'soi' ? 'سوي' : 'شيميل'}</span>
                    </div>
                    <button onclick="deleteVideo('${video.id}', this)" class="bg-red-950 text-red-400 border border-red-900/50 hover:bg-red-900 hover:text-white px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 shrink-0">
                        <i class="fas fa-trash-alt"></i> حذف
                    </button>
                `;
                container.appendChild(item);
            });
        }

        function renderSingleVideo(video) {
            const container = document.getElementById(`uploaded-${video.category}`);
            if(!container) return;
            const card = document.createElement('div');
            card.id = `card-${video.id}`;
            card.className = "video-card bg-gray-900 border border-amber-500/10 rounded-xl overflow-hidden shadow-xl border-2";
            let elementSource = video.isFile ? `<video id="${video.id}" src="${video.source}" controls></video>` : `<iframe id="${video.id}" src="${video.source}" allowfullscreen></iframe>`;
            const isOwner = currentUser && currentUser.username === video.owner;
            const deleteButtonHtml = isOwner ? `<button onclick="deleteVideo('${video.id}', this)" class="text-red-500 text-[11px] font-bold hover:underline bg-red-950/40 px-2 py-1 rounded-lg"><i class="fas fa-trash"></i> حذف</button>` : '';

            card.innerHTML = `
                <div class="p-3 border-b border-gray-800 flex justify-between items-center bg-amber-500/5">
                    <div><span class="text-xs text-amber-500 font-bold">${video.title}</span><span class="text-[9px] text-gray-500 block">بواسطة: ${video.owner}</span></div>
                    <div class="flex items-center gap-3">${deleteButtonHtml}<button onclick="openFullScreen('${video.id}')" class="text-gray-400 hover:text-red-500 text-xs"><i class="fas fa-expand-arrows-alt"></i> تكبير</button></div>
                </div>
                <div class="video-container">${elementSource}</div>
                <div class="p-3 bg-gray-900/50 flex justify-between items-center text-xs">
                    <button onclick="toggleLike(this)" class="text-gray-400 hover:text-red-500"><i class="far fa-heart"></i> إعجاب (<span class="like-count">0</span>)</button>
                    <button onclick="shareVideo('${video.source}')" class="text-gray-400 hover:text-green-500"><i class="far fa-share-square"></i> مشاركة</button>
                </div>`;
            container.appendChild(card);
        }

        function renderAllUploadedVideos() {
            document.getElementById('uploaded-soi').innerHTML = ''; document.getElementById('uploaded-shemale').innerHTML = '';
            let localVideos = JSON.parse(localStorage.getItem('platform_secured_videos')) || [];
            localVideos.forEach(video => renderSingleVideo(video));
        }

        function deleteVideo(id, btn) {
            let localVideos = JSON.parse(localStorage.getItem('platform_secured_videos')) || [];
            const video = localVideos.find(v => v.id === id);
            if (!video || !currentUser || currentUser.username !== video.owner) return;
            
            if(confirm("هل أنت متأكد من حذف هذا الفيديو الخاص بك نهائياً؟")) {
                localVideos = localVideos.filter(v => v.id !== id);
                localStorage.setItem('platform_secured_videos', JSON.stringify(localVideos));
                
                const mainCard = document.getElementById(`card-${id}`);
                if(mainCard) mainCard.remove();
                
                renderMyVideosManagementList();
                showToast("تم الحذف بنجاح.");
            }
        }

        window.onload = function() { updateAuthUI(); renderAllUploadedVideos(); };
        function refreshCurrentPage() { location.reload(); }
        function openFullScreen(id) { const elem = document.getElementById(id); if (elem.requestFullscreen) elem.requestFullscreen(); }
        function showToast(text) { const toast = document.getElementById('toast'); document.getElementById('toastText').innerText = text; toast.classList.remove('translate-y-20', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100'); setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-20', 'opacity-0'); }, 3000); }
        function shareVideo(url) { navigator.clipboard.writeText(url).then(() => showToast("تم نسخ الرابط!")); }
        function toggleLike(button) { const icon = button.querySelector('i'); const countSpan = button.querySelector('.like-count'); let count = parseInt(countSpan.innerText); if (icon.classList.contains('far')) { icon.classList.replace('far', 'fas'); button.classList.add('text-red-500'); countSpan.innerText = count + 1; } else { icon.classList.replace('fas', 'far'); button.classList.remove('text-red-500'); countSpan.innerText = count - 1; } }
    </script>
</body>
</html>
